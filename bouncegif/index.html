<!doctype html>

<!--
ChatGPT prompt:
Create a simple app that resides entirely in a single .html
file.
Base64-encode each of these images and make them part
of the HTML file. 
Also Base64-encode each of these sound files and make them
part of the HTML file.
On loading, the page should randomly select 3 of the images and randomly
select a sound to go with each image. It should animate the
images bouncing around the screen. When an image bounces,
play its corresponding sound.
-->

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bouncy Base64 Images</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b1020;
  }
  .sprite {
    position: absolute;
    width: 128px; height: 128px;
    user-select: none; pointer-events: none;
  }
  #tapOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 32px;
    color: #ffffff;
    background: rgba(11,16,32,0.85);
    z-index: 9999;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="tapOverlay">Tap for sound</div>

<script>
const IMAGES = [
  "../images/bluey.gif",
  "../images/carlton.gif",
  "../images/cat-roomba.gif",
  "../images/cookie-monster.gif",
  "../images/cool-doge.gif",
  "../images/kermit-flail.gif",
  "../images/wob.gif",
  "../images/werecow.webp"
];
const SOUNDS = [
  "../sounds/mixkit-access-allowed-tone-2869.mp3",
  "../sounds/mixkit-atm-cash-machine-key-press-2841.mp3",
  "../sounds/mixkit-bubble-pop-up-alert-notification-2357.mp3",
  "../sounds/mixkit-correct-answer-tone-2870.mp3",
  "../sounds/mixkit-digital-quick-tone-2866.mp3",
  "../sounds/mixkit-doorbell-single-press-333.mp3",
  "../sounds/mixkit-dry-pop-up-notification-alert-2356.mp3",
  "../sounds/mixkit-elevator-tone-2863.mp3",
  "../sounds/mixkit-game-notification-wave-alarm-987.mp3",
  "../sounds/mixkit-gaming-lock-2848.mp3",
  "../sounds/mixkit-guitar-notification-alert-2320.mp3",
  "../sounds/mixkit-interface-hint-notification-911.mp3",
  "../sounds/mixkit-interface-option-select-2573.mp3",
  "../sounds/mixkit-light-button-2580.mp3",
  "../sounds/mixkit-message-pop-alert-2354.mp3",
  "../sounds/mixkit-sci-fi-click-900.mp3",
  "../sounds/mixkit-software-interface-back-2575.mp3"
];

function rand(min, max) { return Math.random() * (max - min) + min; }

function pickRandom(arr, n) {
  const copy = [...arr];
  const out = [];
  while (out.length < n && copy.length) {
    const i = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(i, 1)[0]);
  }
  return out;
}

const SPRITE_COUNT = 3;

// Pick 3 images and sounds (or fewer if not available)
const chosenImages = pickRandom(IMAGES, Math.min(SPRITE_COUNT, IMAGES.length));
const chosenSounds = pickRandom(SOUNDS, Math.min(SPRITE_COUNT, IMAGES.length));

// Create sprites
const sprites = chosenImages.map((img, idx) => {
  const el = document.createElement('img');
  el.className = 'sprite';
  el.src = img;
  document.body.appendChild(el);

  const snd = chosenSounds[idx];
  const audio = new Audio(snd);
  audio.preload = 'auto';

  return {
    el,
    audio,
    x: rand(0, window.innerWidth - 128),
    y: rand(0, window.innerHeight - 128),
    vx: rand(-3, 3) || 2,
    vy: rand(-3, 3) || -2,
  };
});

function tick() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  sprites.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;

    let bounced = false;

    if (s.x <= 0 || s.x + 128 >= w) {
      s.vx *= -1; bounced = true;
      s.x = Math.max(0, Math.min(w - 128, s.x));
    }
    if (s.y <= 0 || s.y + 128 >= h) {
      s.vy *= -1; bounced = true;
      s.y = Math.max(0, Math.min(h - 128, s.y));
    }

    if (bounced) {
      try {
        s.audio.currentTime = 0;
        s.audio.play();
      } catch (e) {}
    }

    s.el.style.transform = `translate(${s.x}px, ${s.y}px)`;
  });

  requestAnimationFrame(tick);
}

window.addEventListener('resize', () => { /* bounds handled per frame */ });
requestAnimationFrame(tick);

const tapOverlay = document.getElementById('tapOverlay');
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  // Prime all audio elements
  sprites.forEach(s => {
    try {
      s.audio.play().then(() => {
        s.audio.pause();
        s.audio.currentTime = 0;
      }).catch(()=>{});
    } catch(e) {}
  });

  tapOverlay.style.display = 'none';
  window.removeEventListener('pointerdown', unlockAudio);
}

window.addEventListener('pointerdown', unlockAudio);

</script>
</body>
</html>
