<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>kiosk</title>
<style>
  /* ---- Tunable colors (change these two lines to re-theme) ---- */
  :root {
    --fg: #00ff00;   /* bright green text       */
    --bg: #000000;   /* black background        */
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  #screen {
    box-sizing: border-box;
    margin: 0;
    padding: 1rem;
    width: 100%;
    height: 100%;
    color: var(--fg);
    background: var(--bg);
    font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace;
    font-size: 72px;
    line-height: 1.3;
    white-space: pre-wrap;     /* wrap long lines, preserve newlines */
    word-break: break-word;
    overflow: hidden;          /* we trim old text instead of scrolling */
  }

  /* Solid block cursor that hard-blinks like a terminal. */
  #cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.05em;
    margin-left: 1px;
    background: var(--fg);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 50%   { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  /* Tap-to-start overlay: gathers the user gesture browsers require
     before audio is allowed to play. Hidden once tapped. */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    background: var(--bg);
    font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace;
    font-size: 72px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
    animation: pulse 1.5s ease-in-out infinite;
  }
  #overlay.hidden {
    display: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
</style>
</head>
<body>
  <pre id="screen"><span id="text"></span><span id="cursor"></span></pre>
  <div id="overlay">Tap to start</div>

  <script>
  (function () {
    "use strict";

    // ----------------------------------------------------------------
    //  Random text color (re-rolled on every load)
    //  Constraint: red + green + blue must total at least 255, so the
    //  text never comes out too dark to read against the black bg.
    // ----------------------------------------------------------------
    (function () {
      var r, g, b;
      do {
        r = Math.floor(Math.random() * 256);
        g = Math.floor(Math.random() * 256);
        b = Math.floor(Math.random() * 256);
      } while (r + g + b < 255);
      document.documentElement.style.setProperty(
        "--fg", "rgb(" + r + ", " + g + ", " + b + ")"
      );
    })();

    var SNIPPETS = [
      "Jeremy appreciates all his caregivers! Thank you!",
      "Shall we play a game?\n1. Chess\n2. Global Thermonuclear War",
      "Jeremy sometimes experiments with growing out his mustache and beard. He wants to look like Evil Spock from Star Trek.",
      "Pentagon IP address identified. Commencing hack.",
      "Wonder Twin powers, activate!",
      "By the power of Greyskull!",
      "Knowing is half the battle!",
      "Jeremy's name... is Neo! Well actually it's Jeremy. But call him Neo if you want to.",
      "Ms. Rachel could totally take Blippie in a fight.",
      "To infinity, and beyond!",
      "Can you think of something... green?",
      "Amarillo!\nNaranja!\nAzul!"
    ];

    var SOUNDS = [
      "../sounds/mixkit-atm-cash-machine-key-press-2841.mp3",
      "../sounds/mixkit-bubble-pop-up-alert-notification-2357.mp3",
      "../sounds/mixkit-correct-answer-tone-2870.mp3",
      "../sounds/mixkit-digital-quick-tone-2866.mp3",
      "../sounds/mixkit-dry-pop-up-notification-alert-2356.mp3",
      "../sounds/mixkit-elevator-tone-2863.mp3",
      "../sounds/mixkit-gaming-lock-2848.mp3",
      "../sounds/mixkit-interface-option-select-2573.mp3",
      "../sounds/mixkit-light-button-2580.mp3",
      "../sounds/mixkit-message-pop-alert-2354.mp3",
      "../sounds/mixkit-sci-fi-click-900.mp3"
    ];

    var TYPE_DELAY_MS    = 10;   // base delay between characters
    var TYPE_JITTER_MS   = 5;    // random extra delay (0..this) per char
    var PAUSE_AFTER_MS   = 5000; // pause after a snippet finishes, before clearing

    var textEl   = document.getElementById("text");
    var textNode = document.createTextNode("");
    textEl.appendChild(textNode);

    var SNIPPETS_PER_SCREEN = 2; // snippets typed before clearing

    var snippetIndex   = 0;
    var charIndex      = 0;
    var screenSnippets = 0; // how many snippets typed since the last clear
    var soundIndex     = -1; // index into SOUNDS for the current phrase

    // ----------------------------------------------------------------
    //  Audio via the Web Audio API.
    //  We deliberately do NOT use a fresh `new Audio()` per keystroke:
    //  browsers cap the number of live HTMLMediaElements, and once that
    //  ceiling is hit play() silently fails and the sound "deactivates".
    //  Instead we decode each clip once into a buffer and fire a cheap,
    //  disposable BufferSource node for every key press.
    // ----------------------------------------------------------------
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var audioCtx = null;
    var buffers = new Array(SOUNDS.length); // decoded AudioBuffers, by index

    function loadBuffer(i) {
      fetch(SOUNDS[i])
        .then(function (resp) { return resp.arrayBuffer(); })
        .then(function (data) {
          // Callback form for Safari, which lacks the promise-based API.
          audioCtx.decodeAudioData(data, function (buf) {
            buffers[i] = buf;
          }, function () {});
        })
        .catch(function () {}); // ignore fetch/decode failures
    }

    function pickSound() {
      soundIndex = (soundIndex + 1) % SOUNDS.length;
    }

    function playKeySound() {
      if (!audioCtx) return;
      // Browsers can suspend the context (tab backgrounded, etc.); nudge it.
      if (audioCtx.state === "suspended") audioCtx.resume();
      var buf = buffers[soundIndex];
      if (!buf) return; // not decoded yet — just skip this click

      var source = audioCtx.createBufferSource();
      source.buffer = buf;
      var gain = audioCtx.createGain();
      gain.gain.value = 0.5; // half volume
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(0);
    }

    pickSound();

    function step() {
      var snippet = SNIPPETS[snippetIndex];

      if (charIndex < snippet.length) {
        textNode.appendData(snippet.charAt(charIndex));
        if (charIndex % 5 === 0) playKeySound(); // sound on every 4th letter
        charIndex++;
        setTimeout(step, TYPE_DELAY_MS + Math.random() * TYPE_JITTER_MS);
      } else {
        // Finished this snippet: pause so it can be read.
        charIndex = 0;
        snippetIndex = (snippetIndex + 1) % SNIPPETS.length;
        screenSnippets++;
        pickSound(); // different sound for the next phrase

        setTimeout(function () {
          if (screenSnippets < SNIPPETS_PER_SCREEN) {
            // More to type on this screen: add a blank line and keep going.
            textNode.appendData("\n\n");
          } else {
            // Screen full: clear and start a fresh screen.
            textNode.data = "";
            screenSnippets = 0;
          }
          step();
        }, PAUSE_AFTER_MS);
      }
    }

    // Wait for a tap before starting. The tap is a user gesture, which
    // unlocks audio playback under browser autoplay policies. We create the
    // AudioContext here (inside the gesture) and start decoding every clip.
    var overlay = document.getElementById("overlay");

    function start() {
      overlay.removeEventListener("click", start);
      overlay.removeEventListener("touchstart", start);
      overlay.classList.add("hidden");

      if (AudioCtx) {
        audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        for (var i = 0; i < SOUNDS.length; i++) loadBuffer(i);
      }

      step();
    }

    overlay.addEventListener("click", start);
    overlay.addEventListener("touchstart", start);
  })();
  </script>
</body>
</html>
